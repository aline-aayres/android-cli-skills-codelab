name: Build and Deploy Codelab

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download claat binary
        run: |
          curl -L https://github.com/googlecodelabs/tools/releases/latest/download/claat-linux-amd64 -o /usr/local/bin/claat
          chmod +x /usr/local/bin/claat
          claat version

      - name: Export Markdown to Codelab HTML
        run: |
          mkdir -p public
          claat export -o public codelab_android_cli_skills.md
          # Move os arquivos gerados da subpasta (id do codelab) para a raiz de public/
          mv public/android-cli-skills-codelab/* public/
          rmdir public/android-cli-skills-codelab

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
