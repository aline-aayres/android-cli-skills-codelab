name: Build and Deploy Codelab

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download claat binary
        run: |
          curl -L https://github.com/googlecodelabs/tools/releases/latest/download/claat-linux-amd64 -o /usr/local/bin/claat
          chmod +x /usr/local/bin/claat
          claat version

      - name: Export Markdown to Codelab HTML
        run: |
          mkdir -p public
          claat export -o public codelab_android_cli_skills.md
          mv public/android-cli-skills-codelab/* public/
          rmdir public/android-cli-skills-codelab
          # 1. Substitui links estáticos href="/"
          sed -i "s|href=\"/\"|href=\"https://github.com/${{ github.repository }}\"|g" public/index.html
          # 2. Define home-url no web component e intercepta cliques em Done / Fechar (X)
          python3 -c '
          import pathlib
          p = pathlib.Path("public/index.html")
          html = p.read_text(encoding="utf-8")
          repo_url = "https://github.com/${{ github.repository }}"
          html = html.replace("<google-codelab ", f"<google-codelab home-url=\"{repo_url}\" ")
          fix_script = f"""<script>
            document.addEventListener("click", function(e) {{
              const btn = e.target.closest("#done, #arrow-back, a[href=\\"/\\"]");
              if (btn) {{
                e.preventDefault();
                e.stopImmediatePropagation();
                window.location.href = "{repo_url}";
              }}
            }}, true);
          </script></body>"""
          html = html.replace("</body>", fix_script)
          p.write_text(html, encoding="utf-8")
          '

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
